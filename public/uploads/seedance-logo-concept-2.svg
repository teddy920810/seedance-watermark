<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">Seedance.co</title>
  <desc id="desc">Seedance video generation, watermark removal, and video upscaling logo.</desc>

  <defs>
    <linearGradient id="brand" x1="38" y1="42" x2="204" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="272" y1="62" x2="1050" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="0.78" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Dissolving pixels represent watermark removal. -->
  <rect x="24" y="29" width="31" height="31" rx="8" fill="#22D3EE"/>
  <rect x="58" y="55" width="23" height="23" rx="6" fill="#22D3EE" opacity=".9"/>
  <rect x="33" y="67" width="18" height="18" rx="5" fill="#22D3EE" opacity=".72"/>
  <rect x="64" y="86" width="13" height="13" rx="4" fill="#4F46E5" opacity=".76"/>

  <!-- Main video frame. -->
  <path d="M78 67h84c19.9 0 36 16.1 36 36v65c0 19.9-16.1 36-36 36H79c-19.9 0-36-16.1-36-36v-64"
        fill="none" stroke="url(#brand)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Expanding outer corner represents video upscaling. -->
  <path d="M175 88h13c18.8 0 34 15.2 34 34v67c0 18.8-15.2 34-34 34H91"
        fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" opacity=".95"/>

  <!-- Play symbol represents AI video generation. -->
  <path d="M98 111.5v53c0 7.1 7.8 11.4 13.8 7.6l40.5-25.8a9 9 0 0 0 0-15.2l-40.5-27.4c-6-4-13.8.3-13.8 7.8Z" fill="url(#brand)"/>

  <!-- AI sparkle. -->
  <path d="M188 21c3.6 15.6 9.4 21.4 25 25-15.6 3.6-21.4 9.4-25 25-3.6-15.6-9.4-21.4-25-25 15.6-3.6 21.4-9.4 25-25Z" fill="#22D3EE"/>
  <circle cx="215" cy="76" r="5" fill="#4F46E5"/>

  <!-- Website wordmark. Font fallbacks keep the SVG portable. -->
  <text x="270" y="166"
        fill="url(#wordmark)"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="104"
        font-weight="750"
        letter-spacing="-5">Seedance<tspan fill="#22D3EE">.co</tspan></text>
</svg>
