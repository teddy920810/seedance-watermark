<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Seedance.co</title>
  <desc id="desc">Square Seedance logo representing AI video generation, watermark removal, and video upscaling.</desc>

  <defs>
    <linearGradient id="tile" x1="52" y1="32" x2="466" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B54F4"/>
      <stop offset=".58" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cyan" x1="116" y1="94" x2="412" y2="362" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1E1B4B" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Square brand surface. -->
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#tile)"/>
  <rect x="20" y="20" width="472" height="472" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="4"/>

  <g filter="url(#softShadow)">
    <!-- Dissolving pixels: watermark removal. -->
    <rect x="88" y="105" width="44" height="44" rx="12" fill="#67E8F9"/>
    <rect x="137" y="140" width="31" height="31" rx="9" fill="#22D3EE" opacity=".92"/>
    <rect x="96" y="157" width="25" height="25" rx="7" fill="#A5F3FC" opacity=".78"/>

    <!-- Primary video frame. -->
    <path d="M160 157h147c38.7 0 70 31.3 70 70v74c0 38.7-31.3 70-70 70H160c-38.7 0-70-31.3-70-70v-91"
          fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Expanding frame: video upscaling. -->
    <path d="M340 184h13c40.3 0 73 32.7 73 73v76c0 40.3-32.7 73-73 73H178"
          fill="none" stroke="url(#cyan)" stroke-width="17" stroke-linecap="round"/>

    <!-- Play symbol: AI video generation. -->
    <path d="M207 222v91.5c0 12.8 14.1 20.6 24.9 13.8l70.3-44.8a16 16 0 0 0 .2-26.8l-70.3-47c-10.8-7.2-25.1.6-25.1 13.3Z" fill="url(#cyan)"/>

    <!-- AI sparkle. -->
    <path d="M382 72c6.5 29.7 18.3 41.5 48 48-29.7 6.5-41.5 18.3-48 48-6.5-29.7-18.3-41.5-48-48 29.7-6.5 41.5-18.3 48-48Z" fill="#FFFFFF"/>
    <circle cx="439" cy="171" r="10" fill="#67E8F9"/>
  </g>

  <!-- Compact wordmark remains readable while preserving the square silhouette. -->
  <text x="256" y="459" text-anchor="middle" fill="#FFFFFF"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="48" font-weight="750" letter-spacing="-2.2">Seedance<tspan fill="#67E8F9">.co</tspan></text>
</svg>
