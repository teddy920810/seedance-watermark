<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Seedance.co</title>
  <desc id="desc">Seedance video generation, watermark removal, and upscaling browser icon.</desc>
  <defs>
    <linearGradient id="tile" x1="7" y1="5" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cyan" x1="12" y1="13" x2="54" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- A solid tile keeps the favicon legible on both light and dark browser chrome. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1.5"/>

  <!-- Video frame and play symbol. -->
  <path d="M20 22h21a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8V29"
        fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 31.2v12.6c0 1.6 1.8 2.5 3.1 1.6l9.2-6.3a1.9 1.9 0 0 0 0-3.2l-9.2-6.3c-1.3-.9-3.1 0-3.1 1.6Z" fill="url(#cyan)"/>

  <!-- Expansion corner: upscale. -->
  <path d="M43 17h7v7" fill="none" stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dissolving pixels: watermark removal. -->
  <rect x="10" y="14" width="6" height="6" rx="1.8" fill="#67E8F9"/>
  <rect x="17.5" y="17" width="4" height="4" rx="1.2" fill="#22D3EE"/>

  <!-- AI sparkle. -->
  <path d="M51.5 7.5c.8 3.7 2.3 5.2 6 6-3.7.8-5.2 2.3-6 6-.8-3.7-2.3-5.2-6-6 3.7-.8 5.2-2.3 6-6Z" fill="#FFFFFF"/>
</svg>
