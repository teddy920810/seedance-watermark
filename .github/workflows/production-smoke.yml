name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Public read-only checks
        run: npm run test:smoke:production:public
        env:
          SMOKE_BASE_URL: https://www.seedances.co
      - name: Authenticated upload and processing checks
        run: npm run test:smoke:production:auth
        env:
          SMOKE_BASE_URL: https://www.seedances.co
          SMOKE_SESSION_COOKIE: ${{ secrets.SMOKE_SESSION_COOKIE }}
